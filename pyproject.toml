[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ancestree-track"
version = "0.2.0"
description = "A Python package for tracing and managing data lineage"
readme = "README.md"
authors = [
  {name = "Joshua Smith", email = "78921007+JS195@users.noreply.github.com"}
]
maintainers = [
  {name = "Joshua Smith", email = "78921007+JS195@users.noreply.github.com"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",  # testing
    "pytest-cov",
    "ruff",    # linting and formatting
    "mypy",    # type checking
]

[project.urls]
Homepage = "https://github.com/JS195/ancestree"
Documentation = "https://js195.github.io/ancestree/"
"Bug Tracker" = "https://github.com/JS195/ancestree/issues"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
  "ancestree",
  "ancestree.db",
  "ancestree.domain",
  "ancestree.ingest",
  "ancestree.web",
]

[tool.setuptools.package-data]
"ancestree" = ["py.typed", "assets/*"]
"ancestree.web" = ["assets/*"]

[tool.ruff]
line-length = 88
# The 0.1.x notebooks are an archive, kept to show what the old API looked
# like. They are not maintained code and are not linted for style.
extend-exclude = ["docs/examples/legacy-0.1"]

[tool.ruff.lint.per-file-ignores]
# Example/benchmark notebooks favour compact cells; allow one-liner if/for and
# semicolons there (still linted for real issues like unused/undefined names).
# B023 fires on the timing closures, where the loop variable is consumed by
# timeit before the next iteration — a false positive for that pattern.
"*.ipynb" = ["E701", "E702", "B023"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true