[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ancestree-track"
version = "0.2.0"
description = "A Python package for tracing and managing data lineage"
readme = "README.md"
authors = [
  {name = "Joshua Smith", email = "78921007+JS195@users.noreply.github.com"}
]
maintainers = [
  {name = "Joshua Smith", email = "78921007+JS195@users.noreply.github.com"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",  # testing
    "pytest-cov",
    "ruff==0.16.0",  # linting and formatting (pinned: its default
                     # rule set widens between releases, which turns
                     # a green CI red without a code change)
    "mypy",    # type checking
]

[project.urls]
Homepage = "https://github.com/JS195/ancestree"
Documentation = "https://js195.github.io/ancestree/"
"Bug Tracker" = "https://github.com/JS195/ancestree/issues"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
  "ancestree",
  "ancestree.db",
  "ancestree.domain",
  "ancestree.ingest",
  "ancestree.web",
]

[tool.setuptools.package-data]
"ancestree" = ["py.typed", "assets/*"]
"ancestree.web" = ["assets/*"]

[tool.ruff]
line-length = 88
# Notebooks are documentation, not source. They are prose with runnable cells,
# edited in Jupyter and shipped with their outputs, so they pick up lint that
# does not apply: a commented-out cleanup line orphans an import, a cell left
# mid-experiment has an unused name. None of that should fail a build of the
# library. Lint them by hand with `ruff check --no-force-exclude <file>.ipynb`
# when it is useful.
extend-exclude = ["*.ipynb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true