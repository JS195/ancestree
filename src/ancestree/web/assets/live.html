<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ancestree — live explorer</title>
<style>
:root {
  --bg: #f7f7f8; --panel: #ffffff; --ink: #1c2024; --muted: #6b7280;
  --line: #e0e2e6; --accent: #3b6ea5; --bad: #e5484d; --chip: #eef1f5;
}
html[data-theme="dark"] {
  --bg: #16181d; --panel: #1f2229; --ink: #e6e8eb; --muted: #9aa0a8;
  --line: #33373f; --accent: #7aa7d4; --bad: #ff6b70; --chip: #2a2e36;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  height: 100vh; display: flex; flex-direction: column;
}
header {
  display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap;
}
header h1 { font-size: 16px; margin: 0; }
#summary { color: var(--muted); }
#search {
  flex: 1; min-width: 240px; max-width: 460px;
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px;
  background: var(--bg); color: var(--ink); font: inherit;
}
button, .tab {
  border: 1px solid var(--line); background: var(--chip); color: var(--ink);
  border-radius: 6px; padding: 4px 11px; cursor: pointer; font: inherit;
}
.tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
main { flex: 1; display: flex; min-height: 0; }
#graph { flex: 1; min-width: 0; }
#runs { flex: 1; min-width: 0; overflow: auto; padding: 14px 16px; display: none; }
#panel {
  width: 380px; overflow-y: auto; background: var(--panel);
  border-left: 1px solid var(--line); padding: 14px 16px;
}
#panel .placeholder { color: var(--muted); margin-top: 20px; }
#panel h2 { font-size: 15px; margin: 0 0 2px; word-break: break-all; }
#panel h3, #diff h3 {
  font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); margin: 18px 0 6px;
}
.badge {
  display: inline-block; font-size: 11px; border-radius: 10px;
  padding: 1px 8px; background: var(--chip); color: var(--muted); margin-right: 6px;
}
.badge.bad { background: var(--bad); color: #fff; }
table.kv { width: 100%; border-collapse: collapse; }
table.kv td { padding: 3px 0; vertical-align: top; border-bottom: 1px solid var(--line); }
table.kv td.k { color: var(--muted); width: 38%; padding-right: 8px; word-break: break-all; }
table.kv td.v { word-break: break-word; }
pre {
  background: var(--chip); border-radius: 6px; padding: 8px;
  overflow-x: auto; font-size: 12px; margin: 4px 0;
}
table.data { border-collapse: collapse; font-size: 12px; margin: 4px 0; max-width: 100%; display: block; overflow-x: auto; }
table.data th, table.data td { border: 1px solid var(--line); padding: 3px 7px; }
img.meta { max-width: 100%; border-radius: 6px; border: 1px solid var(--line); margin: 4px 0; }
a { color: var(--accent); }
ul.arts { list-style: none; padding: 0; margin: 0; }
ul.arts li { padding: 3px 0; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
ul.arts .size { margin-left: auto; color: var(--muted); white-space: nowrap; }
.parent-link, tr.run { cursor: pointer; }
.parent-link { color: var(--accent); text-decoration: underline; }
#runs table { border-collapse: collapse; width: 100%; font-size: 13px; }
#runs th, #runs td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; }
#runs th { cursor: pointer; user-select: none; color: var(--muted); white-space: nowrap; }
#runs tr.run:hover { background: var(--chip); }
#runs td.bad { color: var(--bad); }
#diff {
  position: fixed; right: 16px; bottom: 16px; width: 520px; max-height: 60vh;
  overflow: auto; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 14px 16px; box-shadow: 0 8px 30px rgba(0,0,0,.25);
  display: none;
}
#diff table { width: 100%; border-collapse: collapse; font-size: 13px; }
#diff td, #diff th { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; word-break: break-word; }
#diff tr.same td { color: var(--muted); }
#diff td.delta { color: var(--accent); white-space: nowrap; }
#diff .close { float: right; }
</style>
</head>
<body>
<header>
  <h1>Ancestree</h1>
  <div id="summary"></div>
  <input id="search" placeholder="search: model  accuracy>0.9  step_type=clean  (Enter)">
  <span class="tab active" id="tab-graph">Graph</span>
  <span class="tab" id="tab-runs">Runs</span>
  <button id="theme" title="toggle dark mode">&#9681;</button>
</header>
<main>
  <div id="graph"></div>
  <div id="runs"></div>
  <aside id="panel"><div class="placeholder">Click a node to inspect it — pin two for a diff.</div></aside>
</main>
<div id="diff"></div>
<script>__ANCESTREE_VIS_JS__</script>
<script>
"use strict";

/* ------------------------------ helpers ----------------------------- */
function api(path) { return fetch(path).then(function (r) {
  if (!r.ok) { return r.json().then(function (e) { throw new Error(e.error || r.status); }); }
  return r.json();
}); }
function el(tag, cls, text) {
  var node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}
function fmtBytes(n) {
  if (n === null || n === undefined) return "";
  var units = ["B", "KiB", "MiB", "GiB"]; var i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i += 1; }
  return (i === 0 ? n : n.toFixed(1)) + " " + units[i];
}
function artifactUrl(nodeId, rel) { return "/api/artifact/" + encodeURIComponent(nodeId) + "/" + encodeURI(rel); }

/* ------------------------------ state ------------------------------- */
var GRAPH = null, network = null, visNodes = null;
var parentsOf = {}, childrenOf = {};
var pinned = [];  // up to two node ids for the diff

/* ------------------------------ graph ------------------------------- */
function boot() {
  api("/api/graph").then(function (graph) {
    GRAPH = graph;
    var unhealthy = graph.nodes.filter(function (n) { return !n.healthy; }).length;
    setSummary(graph.nodes.length + " nodes" + (unhealthy ? " · " + unhealthy + " unhealthy" : ""));

    parentsOf = {}; childrenOf = {};
    graph.edges.forEach(function (e) {
      (parentsOf[e.to] = parentsOf[e.to] || []).push(e.from);
      (childrenOf[e.from] = childrenOf[e.from] || []).push(e.to);
    });

    visNodes = new vis.DataSet(graph.nodes.map(function (n) {
      var spec = { id: n.id, label: n.label, group: n.group, level: n.level, shape: "box", margin: 8 };
      if (!n.healthy) { spec.color = { border: "#e5484d" }; spec.borderWidth = 3; spec.shapeProperties = { borderDashes: [6, 4] }; }
      return spec;
    }));
    var visEdges = new vis.DataSet(graph.edges.map(function (e, i) {
      return { id: "e" + i, from: e.from, to: e.to, arrows: "to" };
    }));
    network = new vis.Network(
      document.getElementById("graph"),
      { nodes: visNodes, edges: visEdges },
      {
        layout: { hierarchical: { enabled: true, direction: "LR", sortMethod: "directed", levelSeparation: 190, nodeSpacing: 70 } },
        physics: false,
        interaction: { hover: true },
        edges: { color: { opacity: 0.65 }, smooth: { type: "cubicBezier", forceDirection: "horizontal" } }
      }
    );
    network.on("selectNode", function (params) { openNode(params.nodes[0]); });
    network.on("deselectNode", function () { setDimming(null); });
  });
}
function setSummary(text) { document.getElementById("summary").textContent = text; }
function related(id) {
  var keep = {}; keep[id] = true;
  [parentsOf, childrenOf].forEach(function (map) {
    var stack = [id];
    while (stack.length) {
      var current = stack.pop();
      (map[current] || []).forEach(function (next) {
        if (!keep[next]) { keep[next] = true; stack.push(next); }
      });
    }
  });
  return keep;
}
function setDimming(keep) {
  if (!visNodes) return;
  visNodes.update(GRAPH.nodes.map(function (n) {
    return { id: n.id, opacity: keep === null || keep[n.id] ? 1 : 0.2 };
  }));
}
function openNode(id) {
  setDimming(related(id));
  api("/api/node/" + encodeURIComponent(id)).then(renderDetail);
}

/* ------------------------------ search ------------------------------ */
document.getElementById("search").addEventListener("keydown", function (event) {
  if (event.key !== "Enter") return;
  var query = event.target.value.trim();
  if (!query) { setDimming(null); boot(); return; }
  api("/api/search?q=" + encodeURIComponent(query)).then(function (result) {
    var keep = {};
    result.ids.forEach(function (id) { keep[id] = true; });
    setDimming(keep);
    setSummary(result.ids.length + " match" + (result.ids.length === 1 ? "" : "es") + " · query answered by SQL");
  });
});

/* ------------------------------ detail ------------------------------ */
function kvTable(rows) {
  var table = el("table", "kv");
  rows.forEach(function (pair) {
    var tr = el("tr");
    tr.appendChild(el("td", "k", pair[0]));
    var v = el("td", "v");
    if (pair[1] instanceof Node) v.appendChild(pair[1]); else v.textContent = pair[1];
    tr.appendChild(v);
    table.appendChild(tr);
  });
  return table;
}
function renderValue(nodeId, env) {
  var value = env.value, kind = env.data_type;
  if (kind === "json") return el("pre", null, JSON.stringify(value, null, 2));
  if (kind === "code") return el("pre", "code", value);
  if (kind === "table" && value && value.columns) {
    var table = el("table", "data"), head = el("tr");
    value.columns.forEach(function (c) { head.appendChild(el("th", null, c)); });
    table.appendChild(head);
    (value.rows || []).forEach(function (r) {
      var tr = el("tr");
      r.forEach(function (cell) { tr.appendChild(el("td", null, cell)); });
      table.appendChild(tr);
    });
    return table;
  }
  if (kind === "image") {
    var img = el("img", "meta"); img.src = artifactUrl(nodeId, value); img.alt = value;
    return img;
  }
  if (kind === "link") {
    var href = /^https?:\/\//.test(String(value)) ? value : artifactUrl(nodeId, value);
    var a = el("a", null, value); a.href = href; a.target = "_blank";
    return a;
  }
  return el("span", null, value);
}
function renderDetail(d) {
  var panel = document.getElementById("panel");
  panel.textContent = "";

  panel.appendChild(el("h2", null, d.step_type + " · " + d.node_id));
  panel.appendChild(el("span", "badge" + (d.healthy ? "" : " bad"), d.healthy ? "healthy" : "unhealthy"));
  var pin = el("button", null, pinned.indexOf(d.node_id) >= 0 ? "unpin" : "pin for diff");
  pin.onclick = function () { togglePin(d.node_id); renderDetail(d); };
  panel.appendChild(pin);

  panel.appendChild(el("h3", null, "Structural"));
  var parents = el("span");
  if (d.parent_id.length === 0) parents.textContent = "— (root)";
  d.parent_id.forEach(function (pid, i) {
    if (i) parents.appendChild(document.createTextNode(", "));
    var link = el("span", "parent-link", pid);
    link.onclick = function () { network.selectNodes([pid]); openNode(pid); };
    parents.appendChild(link);
  });
  panel.appendChild(kvTable([
    ["created", d.created_display],
    ["generation", d.generation],
    ["parents", parents],
    ["duration", d.duration_s === null ? "" : d.duration_s + " s"],
    ["size", fmtBytes(d.size_bytes)]
  ]));

  var groups = {};
  Object.keys(d.metadata).sort().forEach(function (key) {
    var group = d.metadata[key].group || "General";
    (groups[group] = groups[group] || []).push(key);
  });
  Object.keys(groups).sort().forEach(function (group) {
    panel.appendChild(el("h3", null, group));
    var table = el("table", "kv");
    groups[group].forEach(function (key) {
      var tr = el("tr");
      tr.appendChild(el("td", "k", key));
      var v = el("td", "v");
      v.appendChild(renderValue(d.node_id, d.metadata[key]));
      tr.appendChild(v);
      table.appendChild(tr);
    });
    panel.appendChild(table);
  });

  if (d.artifacts.length) {
    panel.appendChild(el("h3", null, "Artifacts"));
    var list = el("ul", "arts");
    d.artifacts.forEach(function (artifact) {
      var li = el("li");
      var a = el("a", null, artifact.relpath);
      a.href = artifactUrl(d.node_id, artifact.relpath); a.target = "_blank";
      li.appendChild(a);
      li.appendChild(el("span", "size", fmtBytes(artifact.size)));
      list.appendChild(li);
    });
    panel.appendChild(list);
  }

  panel.appendChild(el("h3", null, "Provenance"));
  panel.appendChild(kvTable(Object.keys(d.provenance).sort().map(function (key) {
    return [key, d.provenance[key] === null ? "" : String(d.provenance[key])];
  })));
}

/* ------------------------------- diff ------------------------------- */
function togglePin(id) {
  var index = pinned.indexOf(id);
  if (index >= 0) pinned.splice(index, 1); else pinned.push(id);
  if (pinned.length > 2) pinned.shift();
  if (pinned.length === 2) showDiff(); else document.getElementById("diff").style.display = "none";
}
function showDiff() {
  api("/api/diff?a=" + encodeURIComponent(pinned[0]) + "&b=" + encodeURIComponent(pinned[1])).then(function (diff) {
    var box = document.getElementById("diff");
    box.textContent = "";
    var close = el("button", "close", "close");
    close.onclick = function () { pinned = []; box.style.display = "none"; };
    box.appendChild(close);
    box.appendChild(el("h3", null, "diff · " + diff.a + " vs " + diff.b));
    var table = el("table");
    var head = el("tr");
    ["key", diff.a, diff.b, "Δ"].forEach(function (h) { head.appendChild(el("th", null, h)); });
    table.appendChild(head);
    diff.rows.forEach(function (row) {
      var tr = el("tr", row.same ? "same" : "");
      tr.appendChild(el("td", null, row.key));
      tr.appendChild(el("td", null, row.a === null || row.a === undefined ? "—" : JSON.stringify(row.a)));
      tr.appendChild(el("td", null, row.b === null || row.b === undefined ? "—" : JSON.stringify(row.b)));
      tr.appendChild(el("td", "delta", row.delta === null ? "" : (row.delta > 0 ? "+" : "") + row.delta));
      table.appendChild(tr);
    });
    box.appendChild(table);
    box.style.display = "block";
  });
}

/* ------------------------------- runs ------------------------------- */
var runsSort = { key: "created", dir: 1 };
function showTab(name) {
  document.getElementById("graph").style.display = name === "graph" ? "block" : "none";
  document.getElementById("runs").style.display = name === "runs" ? "block" : "none";
  document.getElementById("tab-graph").className = "tab" + (name === "graph" ? " active" : "");
  document.getElementById("tab-runs").className = "tab" + (name === "runs" ? " active" : "");
  if (name === "runs") loadRuns();
}
document.getElementById("tab-graph").onclick = function () { showTab("graph"); };
document.getElementById("tab-runs").onclick = function () { showTab("runs"); };

function loadRuns() {
  api("/api/runs").then(function (runs) {
    var container = document.getElementById("runs");
    container.textContent = "";
    var fixed = ["node_id", "step_type", "created", "healthy", "duration_s", "size_bytes"];
    var columns = fixed.concat(runs.columns);
    var table = el("table");
    var head = el("tr");
    columns.forEach(function (column) {
      var th = el("th", null, column + (runsSort.key === column ? (runsSort.dir > 0 ? " ↑" : " ↓") : ""));
      th.onclick = function () {
        runsSort = { key: column, dir: runsSort.key === column ? -runsSort.dir : 1 };
        loadRuns();
      };
      head.appendChild(th);
    });
    table.appendChild(head);

    function cellValue(row, column) {
      if (fixed.indexOf(column) >= 0) return row[column];
      return row.metrics[column];
    }
    runs.rows.sort(function (x, y) {
      var vx = cellValue(x, runsSort.key), vy = cellValue(y, runsSort.key);
      if (vx === undefined || vx === null) return 1;
      if (vy === undefined || vy === null) return -1;
      if (vx < vy) return -runsSort.dir;
      if (vx > vy) return runsSort.dir;
      return 0;
    });
    runs.rows.forEach(function (row) {
      var tr = el("tr", "run");
      columns.forEach(function (column) {
        var value = cellValue(row, column);
        var td = el("td", null, value === undefined || value === null ? "" :
          (column === "size_bytes" ? fmtBytes(value) : value));
        if (column === "healthy" && !value) { td.textContent = "unhealthy"; td.className = "bad"; }
        if (column === "healthy" && value) td.textContent = "ok";
        tr.appendChild(td);
      });
      tr.onclick = function () {
        showTab("graph");
        network.selectNodes([row.node_id]);
        openNode(row.node_id);
      };
      table.appendChild(tr);
    });
    container.appendChild(table);
  });
}

/* ------------------------------- theme ------------------------------ */
var themeButton = document.getElementById("theme");
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem("ancestree-theme", theme); } catch (err) { /* ignore */ }
}
themeButton.onclick = function () {
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
};
try {
  var saved = localStorage.getItem("ancestree-theme");
  if (saved) applyTheme(saved);
} catch (err) { /* ignore */ }

boot();
</script>
</body>
</html>
